# Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
#
# Déploie automatiquement :
#   - kenza-db   : base PostgreSQL managée (avec extension pgvector disponible)
#   - kenza-app  : service web Next.js, buildé depuis le Dockerfile du repo
#
# Utilisation : Render Dashboard > New > Blueprint > sélectionner ce repo.
# Les variables marquées `sync: false` doivent être saisies manuellement
# dans le Dashboard Render après le premier déploiement (jamais commitées).

databases:
  - name: kenza-db
    databaseName: kenza_db
    user: kenza
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: kenza-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      # --- Application ---
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: kenza-app
          property: host
      - key: LOG_LEVEL
        value: info

      # --- Base de données (injectée automatiquement depuis kenza-db) ---
      - key: DATABASE_URL
        fromDatabase:
          name: kenza-db
          property: connectionString

      # --- LangGraph checkpoints ---
      - key: CHECKPOINT_STORAGE
        value: postgresql
      - key: CHECKPOINT_TTL
        value: "3600"

      # --- Authentification ---
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: kenza-app
          property: host

      # --- LLM (obligatoire — à saisir dans le Dashboard Render) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # --- WhatsApp Cloud API (à saisir dans le Dashboard Render) ---
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false

      # --- Twilio (optionnel) ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # --- Feature flags ---
      - key: ENABLE_RAG
        value: "false"
      - key: ENABLE_OCR
        value: "false"
      - key: ENABLE_PDF_REPORTS
        value: "false"
      - key: ENABLE_HUMAN_REVIEW
        value: "false"

      # --- Règles métier ---
      - key: TAX_RATE
        value: "0.20"
      - key: DELIVERY_FEE_MAD
        value: "80"
      - key: MIN_ORDER_MAD
        value: "0"
      - key: DISCOUNT_MAX_PERCENT
        value: "15"
      - key: HIGH_VALUE_THRESHOLD_MAD
        value: "20000"
